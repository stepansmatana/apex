[package]
name = "focus-app"
version = "1.1.0"
description = "Apex - Personal Productivity App"
authors = []
edition = "2021"

[lib]
name = "focus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
